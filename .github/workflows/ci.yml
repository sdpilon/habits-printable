name: CI

on:
  push:
  pull_request:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Timing check
        run: pnpm perf

      - name: Publish benchmark result
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          name: 'Typst compile (largest fitting page, median of 10)'
          tool: 'customSmallerIsBetter'
          output-file-path: perf-result.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

      - name: Margin check
        run: pnpm margins

      - name: End-to-end tests
        run: pnpm e2e

      - name: Build production bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm build

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: dist
          clean: true
          clean-exclude: |
            dev/bench

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
