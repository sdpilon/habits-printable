<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Printable Habit Grid</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <form id="options" autocomplete="off">
        <h1>Printable Habit Grid</h1>

        <label>Title <input name="title" type="text" maxlength="200" /></label>

        <label
          >Layout
          <select name="layout">
            <option value="rows" selected>One row per habit</option>
            <option value="columns">Habits as columns</option>
            <option value="calendars">One mini calendar per habit</option>
          </select>
        </label>

        <div class="field-group numeric-field-group">
          <div class="numeric-row">
            <button type="button" data-stepper="habits" data-direction="decrease" aria-label="Decrease habits">
              −
            </button>
            <label>Habits <input name="habits" type="number" min="1" max="20" step="1" value="5" /></label>
            <button type="button" data-stepper="habits" data-direction="increase" aria-label="Increase habits">
              +
            </button>
          </div>
          <div class="numeric-row">
            <button type="button" data-stepper="days" data-direction="decrease" aria-label="Decrease days">
              −
            </button>
            <label>Days <input name="days" type="number" min="1" max="365" step="1" value="31" /></label>
            <button type="button" data-stepper="days" data-direction="increase" aria-label="Increase days">
              +
            </button>
          </div>
          <div class="numeric-row">
            <button
              type="button"
              data-stepper="perRow"
              data-direction="decrease"
              aria-label="Decrease dots per row"
            >
              −
            </button>
            <label
              >Dots per row <input name="perRow" type="number" min="1" max="31" step="1" value="7"
            /></label>
            <button
              type="button"
              data-stepper="perRow"
              data-direction="increase"
              aria-label="Increase dots per row"
            >
              +
            </button>
          </div>
        </div>

        <div class="field-group">
          <div class="slider-row">
            <label
              >Dot diameter (mm)
              <input name="dotDiameterMm" type="number" min="2" max="5" step="0.1" value="4"
            /></label>
            <div class="readout-row">
              <input
                type="range"
                data-slider-for="dotDiameterMm"
                id="dotDiameterMm-slider"
                min="2"
                max="5"
                step="0.1"
                value="4"
                aria-label="Dot diameter (mm)"
              />
              <output data-readout-for="dotDiameterMm" for="dotDiameterMm-slider">4</output>
            </div>
          </div>
          <div class="slider-row">
            <label
              >Dot spacing (mm)
              <input name="dotSpacingMm" type="number" min="0.5" max="5" step="0.1" value="1.5"
            /></label>
            <div class="readout-row">
              <input
                type="range"
                data-slider-for="dotSpacingMm"
                id="dotSpacingMm-slider"
                min="0.5"
                max="5"
                step="0.1"
                value="1.5"
                aria-label="Dot spacing (mm)"
              />
              <output data-readout-for="dotSpacingMm" for="dotSpacingMm-slider">1.5</output>
            </div>
          </div>
        </div>

        <label
          >Paper
          <select name="paper">
            <option value="letter" selected>US Letter</option>
          </select>
        </label>

        <ul id="messages" aria-live="polite"></ul>
        <button id="download" type="button" disabled>Download PDF</button>
      </form>

      <section id="preview-section" aria-label="Preview" aria-busy="false">
        <p id="warning" hidden>
          The grid is too large for one page. Reduce habits, days, or dots per row to enable
          download.
        </p>
        <div id="preview"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
